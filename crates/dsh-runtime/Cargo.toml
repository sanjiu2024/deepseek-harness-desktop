[package]
name = "dsh-runtime"
description = "Kernel process management and the NDJSON JSON-RPC bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Test-only: one integration test seeds a forked session and asks the kernel to resume it.
# Dev-only on purpose — `dsh-store` must never depend on the runtime, and the runtime must not
# depend on the store at runtime either.
dsh-store = { path = "../dsh-store" }
# The restart tests need a clock they can advance without sleeping for real.
tokio = { version = "1", features = ["full", "test-util"] }
