# Profile patch applied on top of the kernel's `sdk` profile.
# Anything here overrides the shipped composition; keep it minimal and justified.

# ── 1. Session log encoding ──────────────────────────────────────────────
# Upstream defaults to zstd-compressed frames, which must be read through its
# own backend. We only ever read, so plain NDJSON is the cheaper path: the
# client parses it with serde_json and no decoder. Costs 3-5x disk, which is
# acceptable for a single-user desktop app.
- id: session-persistence-jsonl
  config:
    # A patch replaces the row's whole config, so root must be restated.
    root: !!js dshHomePath('sessions')
    compression: 'none'

# ── 2. Session titles ────────────────────────────────────────────────────
# The SDK profile already disables LLM-generated titles (no title surface on
# the wire). Deterministic fallback titles stay; do not re-enable the LLM row.
- id: session-title-llm
  disabled: true

# ── 3. Keep the runtime quiet on stdout ──────────────────────────────────
# stdout is the JSON-RPC channel. Anything chatty must not land there.
# (The kernel already routes logs to stderr; this is a guard, not a fix.)

# ── 4. Provider routes ───────────────────────────────────────────────────
# The base mounts `llm-pi-ai` dormant: it registers nothing until a provider
# profile exists. Declaring `opencode-go` here is what activates that route.
# The key is referenced by name only — the value reaches the process through its
# environment, so no secret ever lands in this repository.
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_API_KEY

# ── 5. Live assistant stream ─────────────────────────────────────────────
# The SDK wire carries durable events only, so a reply arrives whole when the
# turn ends. This plugin subscribes to the kernel's global
# `agent/assistant-stream` event and re-publishes each frame on a tagged stderr
# line, which the desktop client parses into its own notification. Installed by
# `scripts/install-bridge.mjs`; a kernel-side plugin, not a source change.
- insert:
    - id: dsh-desktop-live-bridge
      name: 'dsh-desktop-live-bridge'
