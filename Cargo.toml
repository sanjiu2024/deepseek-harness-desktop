[workspace]
resolver = "3"
members = [
  "crates/dsh-runtime",
  "crates/dsh-store",
  "crates/dsh-native",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sanjiu2024/deepseek-harness-desktop"
rust-version = "1.100"

[workspace.dependencies]
# 异步与序列化
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误与日志
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 存储与 IO
zstd = "0.13"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

# 原生能力
portable-pty = "0.9"
notify = "8"
notify-debouncer-full = "0.5"

# 本仓库内部 crate
dsh-runtime = { path = "crates/dsh-runtime" }
dsh-store = { path = "crates/dsh-store" }
dsh-native = { path = "crates/dsh-native" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
