[workspace]
resolver = "3"
members = [
  "crates/dsh-runtime",
  "crates/dsh-store",
  "crates/dsh-native",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/sanjiu2024/deepseek-harness-desktop"
rust-version = "1.100"

# Only what a crate uses today. A dependency returns here in the same commit
# that starts using it — an unused entry is a warning and a false promise.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crate path dependencies are declared by the consumer, in the same commit that
# starts using them — an entry here with no consumer is a warning and a promise
# nobody is keeping.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
