[package]
name = "dsh-desktop-app"
description = "Tauri entry point: assembles the crates and exposes commands."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# A second launch must focus the running window, not fight it for the WebView2
# user-data directory — that race surfaces as HRESULT(0x800700AA) "resource in use".
tauri-plugin-single-instance = "2"


serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

dsh-runtime = { path = "../../../crates/dsh-runtime" }

# Without `custom-protocol`, a release build has no embedded front end: the window
# opens blank and no command ever reaches Rust. Tauri's own template ships this;
# a hand-written manifest has to add it.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
